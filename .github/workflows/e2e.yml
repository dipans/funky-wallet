name: E2E Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: funky-wallet-e2e/package-lock.json

      # start-e2e.sh runs docker compose up --build which builds all images
      - name: Start e2e stack
        run: bash scripts/start-e2e.sh
        env:
          VITE_AUTH_DISABLED: "true"
          E2E_USER_ID: e2e-test-user

      - name: Install Playwright
        run: cd funky-wallet-e2e && npm ci && npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: cd funky-wallet-e2e && npm test
        env:
          E2E_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:8080

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: funky-wallet-e2e/playwright-report/
          retention-days: 7

      - name: Stop e2e stack
        if: always()
        run: bash scripts/stop-e2e.sh
