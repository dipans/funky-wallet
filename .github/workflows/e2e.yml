name: E2E Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: funkywallet_dev
          POSTGRES_USER: funky
          POSTGRES_PASSWORD: funky
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: corretto
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            funky-wallet-ui/package-lock.json
            funky-wallet-e2e/package-lock.json

      # Build all services
      - name: Build wallet-api-service
        run: cd wallet-api-service && ./mvnw package -DskipTests -q

      - name: Build evm-chain-adapter
        run: cd evm-chain-adapter && ./mvnw package -DskipTests -q

      - name: Build solana-chain-adapter
        run: cd solana-chain-adapter && ./mvnw package -DskipTests -q

      - name: Build mock-signing-coordinator
        run: cd mock-services/mock-signing-coordinator && ./mvnw package -DskipTests -q

      # Start the full e2e stack
      - name: Start e2e stack
        run: bash scripts/start-e2e.sh
        env:
          VITE_AUTH_DISABLED: "true"
          E2E_USER_ID: e2e-test-user

      # Install Playwright
      - name: Install Playwright
        run: cd funky-wallet-e2e && npm ci && npx playwright install --with-deps chromium

      # Run tests
      - name: Run e2e tests
        run: cd funky-wallet-e2e && npm test
        env:
          E2E_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:8080

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: funky-wallet-e2e/playwright-report/
          retention-days: 7

      - name: Stop e2e stack
        if: always()
        run: bash scripts/stop-e2e.sh
