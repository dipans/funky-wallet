services:

  # ---------------------------------------------------------------------------
  # Mock Signing Coordinator — single instance, port 9000
  # ---------------------------------------------------------------------------
  mock-signing-coordinator:
    build:
      context: ./mock-signing-coordinator
      dockerfile: Dockerfile
    container_name: funkywallet-mock-signing-coordinator
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      PORT: 9000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Mock MPC Nodes — three instances on ports 9011, 9012, 9013
  # ---------------------------------------------------------------------------
  mock-mpc-node-1:
    build:
      context: ./mock-mpc-node
      dockerfile: Dockerfile
    container_name: funkywallet-mock-mpc-node-1
    restart: unless-stopped
    ports:
      - "9011:9011"
    environment:
      PORT: 9011
      NODE_ID: mpc-node-1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9011/actuator/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mock-mpc-node-2:
    build:
      context: ./mock-mpc-node
      dockerfile: Dockerfile
    container_name: funkywallet-mock-mpc-node-2
    restart: unless-stopped
    ports:
      - "9012:9012"
    environment:
      PORT: 9012
      NODE_ID: mpc-node-2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9012/actuator/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mock-mpc-node-3:
    build:
      context: ./mock-mpc-node
      dockerfile: Dockerfile
    container_name: funkywallet-mock-mpc-node-3
    restart: unless-stopped
    ports:
      - "9013:9013"
    environment:
      PORT: 9013
      NODE_ID: mpc-node-3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9013/actuator/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Mock Chain Adapter — single instance, port 9090
  # ---------------------------------------------------------------------------
  mock-chain-adapter:
    build:
      context: ./mock-chain-adapter
      dockerfile: Dockerfile
    container_name: funkywallet-mock-chain-adapter
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      PORT: 9090
      FAILURE_RATE: 0.05
      BLOCK_TIME_MS: 500
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
