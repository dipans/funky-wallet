apiVersion: apps/v1
kind: Deployment
metadata:
  name: signing-coordinator
  namespace: funky-wallet
  labels:
    app.kubernetes.io/name: signing-coordinator
    app.kubernetes.io/part-of: funky-wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signing-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signing-coordinator
        app.kubernetes.io/part-of: funky-wallet
    spec:
      containers:
        - name: signing-coordinator
          image: ghcr.io/dipans/mock-signing-coordinator:latest
          ports:
            - containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: signing-coordinator
  namespace: funky-wallet
  labels:
    app.kubernetes.io/name: signing-coordinator
    app.kubernetes.io/part-of: funky-wallet
spec:
  selector:
    app.kubernetes.io/name: signing-coordinator
  ports:
    - port: 9000
      targetPort: 9000
