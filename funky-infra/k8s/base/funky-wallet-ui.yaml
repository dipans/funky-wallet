apiVersion: apps/v1
kind: Deployment
metadata:
  name: funky-wallet-ui
  namespace: funky-wallet
  labels:
    app.kubernetes.io/name: funky-wallet-ui
    app.kubernetes.io/part-of: funky-wallet
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: funky-wallet-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: funky-wallet-ui
        app.kubernetes.io/part-of: funky-wallet
    spec:
      containers:
        - name: funky-wallet-ui
          image: ghcr.io/dipans/funky-wallet-ui:latest
          ports:
            - containerPort: 3000
          env:
            # Auth0 config is baked into the image at build time via VITE_ vars.
            # These env vars are only used if the image supports runtime injection.
            - name: VITE_AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: funky-wallet-secrets
                  key: auth0-domain
            - name: VITE_AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: funky-wallet-secrets
                  key: auth0-client-id
            - name: VITE_AUTH0_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: funky-wallet-secrets
                  key: auth0-audience
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: funky-wallet-ui
  namespace: funky-wallet
  labels:
    app.kubernetes.io/name: funky-wallet-ui
    app.kubernetes.io/part-of: funky-wallet
spec:
  selector:
    app.kubernetes.io/name: funky-wallet-ui
  ports:
    - port: 3000
      targetPort: 3000
