apiVersion: apps/v1
kind: Deployment
metadata:
  name: evm-chain-adapter
  namespace: funky-wallet
  labels:
    app.kubernetes.io/name: evm-chain-adapter
    app.kubernetes.io/part-of: funky-wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: evm-chain-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evm-chain-adapter
        app.kubernetes.io/part-of: funky-wallet
    spec:
      containers:
        - name: evm-chain-adapter
          image: ghcr.io/dipans/evm-chain-adapter:latest
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: evm-chain-adapter
  namespace: funky-wallet
  labels:
    app.kubernetes.io/name: evm-chain-adapter
    app.kubernetes.io/part-of: funky-wallet
spec:
  selector:
    app.kubernetes.io/name: evm-chain-adapter
  ports:
    - port: 9090
      targetPort: 9090
