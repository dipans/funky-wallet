apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: funky-wallet

resources:
  - ../../base

patches:
  # Single replicas in dev to save resources
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: wallet-api-service
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: funky-wallet-ui
