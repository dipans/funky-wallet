services:
  geth-node:
    image: ghcr.io/dipans/geth:latest
    replicas: 1
    containerPort: 8545
    servicePort: 8545
    healthCheck:
      type: tcp              # geth JSON-RPC doesn't respond to GET / — use TCP check
    startupDelay: 15
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: 1000m, memory: 1Gi }
    hpa:
      enabled: false
    pdb:
      enabled: false
