services:
  signing-coordinator:
    image: ghcr.io/dipans/mock-signing-coordinator:latest
    replicas: 1
    containerPort: 9000
    servicePort: 9000
    healthCheck:
      type: tcp              # no HTTP health endpoint — just check port is open
    startupDelay: 25
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: 500m, memory: 512Mi }
    hpa:
      enabled: false
    pdb:
      enabled: false
