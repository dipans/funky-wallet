{{- range $name, $svc := .Values.services }}
{{- if and $svc.pdb $svc.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}-pdb
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "funky-wallet.labels" $ | nindent 4 }}
spec:
  minAvailable: {{ $svc.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "funky-wallet.selectorLabels" (dict "name" $name) | nindent 6 }}
{{- end }}
{{- end }}
